---
- name: Create the prometheus group
  ansible.builtin.group:
    name: prometheus
    system: true

- name: Create the prometheus user
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    system: true
    shell: /usr/sbin/nologin
    home: "{{ prometheus_data_dir }}"
    create_home: false

- name: Create the configuration and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: prometheus
    mode: "0755"
  loop:
    - { path: "{{ prometheus_config_dir }}", owner: root }
    - { path: "{{ prometheus_data_dir }}", owner: prometheus }

# The release is unpacked into a versioned directory, so changing
# prometheus_version installs the new release and restarts the service.
- name: Download Prometheus {{ prometheus_version }}
  ansible.builtin.get_url:
    url: "{{ _prometheus_base_url }}/{{ _prometheus_name }}.tar.gz"
    dest: "{{ prometheus_install_dir }}/{{ _prometheus_name }}.tar.gz"
    checksum: "sha256:{{ _prometheus_base_url }}/sha256sums.txt"
    owner: root
    group: root
    mode: "0644"

- name: Unpack Prometheus {{ prometheus_version }}
  ansible.builtin.unarchive:
    src: "{{ prometheus_install_dir }}/{{ _prometheus_name }}.tar.gz"
    dest: "{{ prometheus_install_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ prometheus_install_dir }}/{{ _prometheus_name }}/prometheus"
  notify: Restart prometheus

- name: Link prometheus and promtool into /usr/local/bin
  ansible.builtin.file:
    src: "{{ prometheus_install_dir }}/{{ _prometheus_name }}/{{ item }}"
    dest: /usr/local/bin/{{ item }}
    state: link
  loop:
    - prometheus
    - promtool

- name: Install the alerting and recording rules from the post
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_config_dir }}/{{ item }}"
    owner: root
    group: prometheus
    mode: "0644"
    validate: /usr/local/bin/promtool check rules %s
  loop:
    - haproxy_alerts.yml
    - haproxy_rules.yml
  notify: Reload prometheus

- name: Write prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: prometheus
    mode: "0644"
    validate: /usr/local/bin/promtool check config --syntax-only %s
  notify: Reload prometheus

- name: Install the systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
